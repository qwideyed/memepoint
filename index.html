<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemePoint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            mpdark: {
              bg: '#0f1117',
              card: '#161922',
              border: '#262b3a',
              hover: '#1f2430'
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      background-color: #0f1117;
      color: #e2e8f0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="w-full bg-[#161922] border-b border-[#262b3a] sticky top-0 z-30 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-4">
        <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-white tracking-tight">
          <span class="w-8 h-8 rounded-lg bg-pink-600 flex items-center justify-center text-white text-sm font-black">MP</span>
          <span>MemePoint</span>
        </a>
      </div>

      <div class="flex-1 max-w-md mx-2">
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-semibold">#</span>
          <input 
            type="text" 
            id="tagSearchInput"
            placeholder="Search tags only (e.g. gaming, cats)..." 
            class="w-full bg-[#0f1117] border border-[#262b3a] rounded-lg pl-7 pr-8 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-pink-500"
            oninput="handleTagSearch(this.value)"
          />
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <button 
          id="savedToggleBtn" 
          onclick="toggleSavedFilter()" 
          title="Saved Memes"
          class="p-2 rounded-lg bg-[#0f1117] border border-[#262b3a] text-slate-400 hover:text-white">
          <i data-lucide="bookmark" class="w-4 h-4"></i>
        </button>

        <a 
          href="donate.html" 
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-amber-500/40 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 text-sm font-medium transition-colors">
          <i data-lucide="heart" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Donate</span>
        </a>

        <a 
          href="post.html" 
          class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-pink-600 hover:bg-pink-700 text-white text-sm font-semibold transition-colors">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Post</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-[#262b3a] pb-3">
      <div class="flex items-center gap-2">
        <button onclick="setFilter('trending')" id="tabTrending" class="filter-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-pink-600 text-white">Trending</button>
        <button onclick="setFilter('new')" id="tabNew" class="filter-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-[#161922] text-slate-400 hover:text-white border border-[#262b3a]">New</button>
        <button onclick="setFilter('og')" id="tabOG" class="filter-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-[#161922] text-slate-400 hover:text-white border border-[#262b3a]">OG</button>
        <button onclick="setFilter('clicks')" id="tabClicks" class="filter-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-[#161922] text-slate-400 hover:text-white border border-[#262b3a]">Most Clicks</button>
      </div>

      <div id="filterTagNotice" class="hidden items-center gap-2 text-xs text-pink-400 bg-pink-500/10 px-3 py-1.5 rounded-lg border border-pink-500/20">
        <span>Filtering by tag: <b id="activeTagLabel"></b></span>
        <button onclick="clearSearch()" class="text-slate-400 hover:text-white underline">Clear</button>
      </div>
    </div>

    <div id="memeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <div id="emptyView" class="hidden flex-col items-center justify-center py-20 text-center">
      <div class="w-14 h-14 rounded-full bg-[#161922] border border-[#262b3a] flex items-center justify-center text-slate-400 mb-3">
        <i data-lucide="image-off" class="w-6 h-6"></i>
      </div>
      <h2 class="text-lg font-bold text-white mb-1">No memes found</h2>
      <p class="text-sm text-slate-400 mb-4 max-w-sm">No memes match this tag or filter yet. Post one to get started.</p>
      <a href="post.html" class="px-4 py-2 rounded-lg bg-pink-600 hover:bg-pink-700 text-white text-sm font-semibold">Post a Meme</a>
    </div>
  </main>

  <footer class="w-full bg-[#161922] border-t border-[#262b3a] py-4 text-center text-xs text-slate-500">
    <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
      <span>MemePoint &bull; 100% Free Meme Sharing</span>
      <div class="flex items-center gap-3">
        <a href="donate.html" class="hover:text-amber-400">Donate</a>
        <a href="post.html" class="hover:text-slate-300">Submit Meme</a>
      </div>
    </div>
  </footer>

  <script>
    let currentFilter = 'trending';
    let currentTag = '';
    let isShowingSaved = false;
    let savedIds = new Set();
    let memes = [];

    function init() {
      try {
        const storedSaved = localStorage.getItem('mp_saved');
        if (storedSaved) savedIds = new Set(JSON.parse(storedSaved));

        const storedMemes = localStorage.getItem('mp_memes');
        if (storedMemes) {
          memes = JSON.parse(storedMemes);
        } else {
          memes = [];
        }
      } catch (err) {
        memes = [];
      }

      renderFeed();
      lucide.createIcons();
    }

    function setFilter(type) {
      currentFilter = type;
      isShowingSaved = false;
      updateFilterButtons();
      renderFeed();
    }

    function updateFilterButtons() {
      const tabs = ['trending', 'new', 'og', 'clicks'];
      tabs.forEach(t => {
        const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
        if (!btn) return;
        if (t === currentFilter && !isShowingSaved) {
          btn.className = "filter-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-pink-600 text-white";
        } else {
          btn.className = "filter-tab px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-[#161922] text-slate-400 hover:text-white border border-[#262b3a]";
        }
      });

      const saveBtn = document.getElementById('savedToggleBtn');
      if (isShowingSaved) {
        saveBtn.className = "p-2 rounded-lg bg-pink-600/20 border border-pink-500/40 text-pink-400";
      } else {
        saveBtn.className = "p-2 rounded-lg bg-[#0f1117] border border-[#262b3a] text-slate-400 hover:text-white";
      }
    }

    function toggleSavedFilter() {
      isShowingSaved = !isShowingSaved;
      updateFilterButtons();
      renderFeed();
    }

    function handleTagSearch(val) {
      currentTag = val.trim().toLowerCase().replace(/^#/, '');
      const clearBtn = document.getElementById('clearSearchBtn');
      const notice = document.getElementById('filterTagNotice');
      const label = document.getElementById('activeTagLabel');

      if (currentTag) {
        clearBtn.classList.remove('hidden');
        notice.classList.remove('hidden');
        notice.classList.add('flex');
        label.innerText = '#' + currentTag;
      } else {
        clearBtn.classList.add('hidden');
        notice.classList.add('hidden');
        notice.classList.remove('flex');
      }
      renderFeed();
    }

    function clearSearch() {
      const input = document.getElementById('tagSearchInput');
      input.value = '';
      currentTag = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('filterTagNotice').classList.add('hidden');
      document.getElementById('filterTagNotice').classList.remove('flex');
      renderFeed();
    }

    function filterByClickedTag(tag) {
      const input = document.getElementById('tagSearchInput');
      input.value = tag;
      handleTagSearch(tag);
    }

    function toggleSave(id, e) {
      if (e) e.stopPropagation();
      if (savedIds.has(id)) {
        savedIds.delete(id);
      } else {
        savedIds.add(id);
      }
      localStorage.setItem('mp_saved', JSON.stringify(Array.from(savedIds)));
      renderFeed();
    }

    function recordClickAndOpen(id, e) {
      const meme = memes.find(m => m.id === id);
      if (meme) {
        meme.clicks = (meme.clicks || 0) + 1;
        localStorage.setItem('mp_memes', JSON.stringify(memes));
      }
      window.location.href = `entry.html?id=${id}`;
    }

    function renderFeed() {
      const grid = document.getElementById('memeGrid');
      const empty = document.getElementById('emptyView');

      let list = [...memes];

      if (isShowingSaved) {
        list = list.filter(m => savedIds.has(m.id));
      }

      if (currentTag) {
        list = list.filter(m => {
          if (!m.tags || !Array.isArray(m.tags)) return false;
          return m.tags.some(t => t.toLowerCase().includes(currentTag));
        });
      }

      if (currentFilter === 'trending') {
        list.sort((a, b) => ((b.clicks || 0) * 2 + (b.createdAt || 0) / 100000000) - ((a.clicks || 0) * 2 + (a.createdAt || 0) / 100000000));
      } else if (currentFilter === 'new') {
        list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      } else if (currentFilter === 'og') {
        list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      } else if (currentFilter === 'clicks') {
        list.sort((a, b) => (b.clicks || 0) - (a.clicks || 0));
      }

      if (list.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        empty.classList.add('flex');
        return;
      }

      empty.classList.add('hidden');
      empty.classList.remove('flex');

      grid.innerHTML = list.map(m => {
        const isSaved = savedIds.has(m.id);
        const tags = (m.tags || []).map(t => 
          `<button onclick="event.stopPropagation(); filterByClickedTag('${escapeAttr(t)}')" class="text-[11px] px-2 py-0.5 rounded bg-[#0f1117] hover:bg-[#262b3a] text-slate-400 hover:text-white transition-colors">#${escapeHtml(t)}</button>`
        ).join('');

        let mediaHtml = '';
        if (m.type === 'video' || (m.url && m.url.match(/\.(mp4|webm|ogg)$/i))) {
          mediaHtml = `
            <video src="${m.url}" controls class="w-full max-h-96 object-contain bg-black" preload="metadata"></video>
          `;
        } else {
          mediaHtml = `
            <div class="w-full aspect-square bg-[#0f1117] flex items-center justify-center overflow-hidden">
              <img 
                src="${m.url}" 
                alt="${escapeAttr(m.title || 'Meme')}" 
                loading="lazy" 
                class="w-full h-full object-cover group-hover:opacity-95" 
                onerror="this.onerror=null; this.src='https://placehold.co/600x600/161922/e2e8f0?text=No+Media';"
              />
            </div>
          `;
        }

        return `
          <article onclick="recordClickAndOpen('${m.id}', event)" class="group cursor-pointer bg-[#161922] border border-[#262b3a] hover:border-slate-600 rounded-xl overflow-hidden flex flex-col transition-all">
            <div class="p-3 flex items-center justify-between border-b border-[#262b3a]">
              <h2 class="text-sm font-semibold text-white truncate pr-2">${escapeHtml(m.title || 'Untitled Meme')}</h2>
              <button 
                onclick="toggleSave('${m.id}', event)" 
                title="${isSaved ? 'Remove bookmark' : 'Bookmark meme'}"
                class="p-1.5 rounded hover:bg-[#0f1117] ${isSaved ? 'text-pink-500' : 'text-slate-400 hover:text-white'} transition-colors">
                <i data-lucide="bookmark" class="w-4 h-4 ${isSaved ? 'fill-current' : ''}"></i>
              </button>
            </div>

            ${mediaHtml}

            <div class="p-3 flex flex-col gap-2 mt-auto border-t border-[#262b3a]">
              <div class="flex flex-wrap gap-1">
                ${tags}
              </div>
              <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                <span class="flex items-center gap-1">
                  <i data-lucide="mouse-pointer" class="w-3.5 h-3.5"></i>
                  ${m.clicks || 0} clicks
                </span>
                <span>${m.createdAt ? new Date(m.createdAt).toLocaleDateString() : ''}</span>
              </div>
            </div>
          </article>
        `;
      }).join('');

      lucide.createIcons();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(str) {
      if (!str) return '';
      return String(str).replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
