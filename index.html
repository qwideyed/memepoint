<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemePoint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-bg-hover: rgba(255, 255, 255, 0.08);
      --glass-card: rgba(25, 27, 36, 0.45);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-top: rgba(255, 255, 255, 0.28);
      --glass-inner-glow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.22);
      --glass-pill-active: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #050608;
      color: #f5f5f7;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-sphere {
      position: fixed;
      border-radius: 9999px;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    .glass-nav {
      background: rgba(18, 20, 29, 0.65);
      backdrop-filter: blur(36px) saturate(190%);
      -webkit-backdrop-filter: blur(36px) saturate(190%);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4), inset 0 -1px 0 rgba(255, 255, 255, 0.05);
    }

    .glass-panel {
      background: var(--glass-card);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), var(--glass-inner-glow);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25), inset 0 1px 0.5px rgba(255, 255, 255, 0.2);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.24);
      transform: translateY(-1px);
    }

    .glass-pill-active {
      background: rgba(255, 255, 255, 0.22) !important;
      border: 1px solid rgba(255, 255, 255, 0.35) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.35) !important;
    }

    .glass-card {
      background: rgba(22, 25, 36, 0.5);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.55), inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      transform: translateY(-3px) scale(1.008);
      border-color: rgba(255, 255, 255, 0.22);
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.75), inset 0 1px 1px 0 rgba(255, 255, 255, 0.28);
    }

    .glass-search {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4), inset 0 1px 0.5px rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    .glass-search:focus-within {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <div class="ambient-sphere w-[550px] h-[550px] -top-32 -left-32 bg-violet-600/30"></div>
  <div class="ambient-sphere w-[600px] h-[600px] top-1/4 -right-48 bg-blue-600/25"></div>
  <div class="ambient-sphere w-[500px] h-[500px] bottom-10 left-1/3 bg-fuchsia-600/20"></div>

  <div class="relative z-10 flex flex-col flex-1">
    <header class="glass-nav sticky top-0 z-40 px-5 py-3.5 transition-all">
      <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
        
        <a href="index.html" class="flex items-center gap-3 group focus:outline-none">
          <div class="w-10 h-10 rounded-2xl glass-pill flex items-center justify-center relative overflow-hidden group-hover:scale-105 transition-transform">
            <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500/40 via-purple-500/30 to-pink-500/40"></div>
            <span class="relative font-bold text-base tracking-tighter text-white drop-shadow">MP</span>
          </div>
          <div class="flex flex-col">
            <span class="text-base font-semibold tracking-tight text-white/95">MemePoint</span>
            <span class="text-[10px] tracking-wide text-white/45 font-medium -mt-1 uppercase">Curated Feed</span>
          </div>
        </a>

        <div class="flex-1 max-w-md mx-2">
          <div class="glass-search rounded-full px-3.5 py-1.5 flex items-center gap-2">
            <span class="text-white/40 text-xs font-semibold pl-1">#</span>
            <input 
              type="text" 
              id="tagSearchInput"
              placeholder="Search hashtags only..." 
              class="w-full bg-transparent border-0 text-sm text-white placeholder-white/40 focus:outline-none"
              oninput="handleTagSearch(this.value)"
            />
            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden text-white/40 hover:text-white transition-colors p-1">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>

        <nav class="flex items-center gap-2.5">
          <button 
            id="savedToggleBtn" 
            onclick="toggleSavedFilter()" 
            title="Saved Memes"
            class="glass-pill rounded-full p-2 text-white/70 hover:text-white flex items-center justify-center">
            <i data-lucide="bookmark" class="w-4 h-4"></i>
          </button>

          <a 
            href="donate.html" 
            class="glass-pill rounded-full px-4 py-2 text-amber-300 hover:text-amber-200 text-xs font-medium flex items-center gap-1.5 border-amber-400/20">
            <i data-lucide="heart" class="w-3.5 h-3.5 fill-amber-400/20"></i>
            <span class="hidden sm:inline">Donate</span>
          </a>

          <a 
            href="post.html" 
            class="glass-pill rounded-full px-4 py-2 text-white text-xs font-semibold flex items-center gap-1.5 bg-white/10 hover:bg-white/20 border-white/25">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>Post</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-5 py-8 flex-1 flex flex-col gap-7">
      
      <div class="flex flex-wrap items-center justify-between gap-4">
        
        <div class="glass-panel rounded-full p-1.5 inline-flex items-center gap-1">
          <button onclick="setFilter('trending')" id="tabTrending" class="glass-pill-active rounded-full px-4 py-1.5 text-xs font-medium transition-all">Trending</button>
          <button onclick="setFilter('new')" id="tabNew" class="glass-pill rounded-full px-4 py-1.5 text-xs font-medium text-white/70 hover:text-white transition-all">New</button>
          <button onclick="setFilter('og')" id="tabOG" class="glass-pill rounded-full px-4 py-1.5 text-xs font-medium text-white/70 hover:text-white transition-all">OG</button>
          <button onclick="setFilter('clicks')" id="tabClicks" class="glass-pill rounded-full px-4 py-1.5 text-xs font-medium text-white/70 hover:text-white transition-all">Most Clicks</button>
        </div>

        <div id="filterTagNotice" class="hidden items-center gap-2 text-xs text-indigo-300 glass-panel px-3.5 py-1.5 rounded-full border-indigo-400/30">
          <span class="flex items-center gap-1">
            <span class="text-white/50">Tag:</span>
            <span id="activeTagLabel" class="font-semibold text-white"></span>
          </span>
          <button onclick="clearSearch()" class="text-white/40 hover:text-white ml-1">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>

      </div>

      <div id="memeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

      <div id="emptyView" class="hidden flex-col items-center justify-center py-28 text-center">
        <div class="w-16 h-16 rounded-3xl glass-panel flex items-center justify-center text-white/40 mb-4 shadow-xl">
          <i data-lucide="sparkles" class="w-7 h-7"></i>
        </div>
        <h2 class="text-base font-semibold text-white tracking-tight mb-1">No memes discovered yet</h2>
        <p class="text-xs text-white/50 mb-5 max-w-xs">Be the first to share one in this feed or adjust your search tags.</p>
        <a href="post.html" class="glass-pill rounded-full px-5 py-2.5 text-xs font-semibold text-white bg-white/10 hover:bg-white/20">
          Post Meme
        </a>
      </div>

    </main>

    <footer class="glass-nav mt-auto py-5 px-5 text-center text-xs text-white/40">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
        <span class="tracking-wide">MemePoint &bull; Designed in Cupertino Glass Aesthetic</span>
        <div class="flex items-center gap-5">
          <a href="donate.html" class="hover:text-amber-300 transition-colors">Support Project</a>
          <a href="post.html" class="hover:text-white transition-colors">Submit Feed</a>
        </div>
      </div>
    </footer>

  </div>

  <script>
    let currentFilter = 'trending';
    let currentTag = '';
    let isShowingSaved = false;
    let savedIds = new Set();
    let memes = [];

    function init() {
      try {
        const storedSaved = localStorage.getItem('mp_saved');
        if (storedSaved) savedIds = new Set(JSON.parse(storedSaved));

        const storedMemes = localStorage.getItem('mp_memes');
        if (storedMemes) {
          memes = JSON.parse(storedMemes);
        } else {
          memes = [];
        }
      } catch (e) {
        memes = [];
      }

      renderFeed();
      lucide.createIcons();
    }

    function setFilter(type) {
      currentFilter = type;
      isShowingSaved = false;
      updateFilterButtons();
      renderFeed();
    }

    function updateFilterButtons() {
      const tabs = ['trending', 'new', 'og', 'clicks'];
      tabs.forEach(t => {
        const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
        if (!btn) return;
        if (t === currentFilter && !isShowingSaved) {
          btn.className = "glass-pill-active rounded-full px-4 py-1.5 text-xs font-medium transition-all";
        } else {
          btn.className = "glass-pill rounded-full px-4 py-1.5 text-xs font-medium text-white/70 hover:text-white transition-all";
        }
      });

      const saveBtn = document.getElementById('savedToggleBtn');
      if (isShowingSaved) {
        saveBtn.className = "glass-pill-active rounded-full p-2 text-white flex items-center justify-center";
      } else {
        saveBtn.className = "glass-pill rounded-full p-2 text-white/70 hover:text-white flex items-center justify-center";
      }
    }

    function toggleSavedFilter() {
      isShowingSaved = !isShowingSaved;
      updateFilterButtons();
      renderFeed();
    }

    function handleTagSearch(val) {
      currentTag = val.trim().toLowerCase().replace(/^#/, '');
      const clearBtn = document.getElementById('clearSearchBtn');
      const notice = document.getElementById('filterTagNotice');
      const label = document.getElementById('activeTagLabel');

      if (currentTag) {
        clearBtn.classList.remove('hidden');
        notice.classList.remove('hidden');
        notice.classList.add('flex');
        label.innerText = '#' + currentTag;
      } else {
        clearBtn.classList.add('hidden');
        notice.classList.add('hidden');
        notice.classList.remove('flex');
      }
      renderFeed();
    }

    function clearSearch() {
      const input = document.getElementById('tagSearchInput');
      input.value = '';
      currentTag = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('filterTagNotice').classList.add('hidden');
      document.getElementById('filterTagNotice').classList.remove('flex');
      renderFeed();
    }

    function filterByClickedTag(tag) {
      const input = document.getElementById('tagSearchInput');
      input.value = tag;
      handleTagSearch(tag);
    }

    function toggleSave(id, e) {
      if (e) e.stopPropagation();
      if (savedIds.has(id)) {
        savedIds.delete(id);
      } else {
        savedIds.add(id);
      }
      localStorage.setItem('mp_saved', JSON.stringify(Array.from(savedIds)));
      renderFeed();
    }

    function recordClickAndOpen(id, e) {
      const meme = memes.find(m => m.id === id);
      if (meme) {
        meme.clicks = (meme.clicks || 0) + 1;
        localStorage.setItem('mp_memes', JSON.stringify(memes));
      }
      window.location.href = `entry.html?id=${id}`;
    }

    function renderFeed() {
      const grid = document.getElementById('memeGrid');
      const empty = document.getElementById('emptyView');

      let list = [...memes];

      if (isShowingSaved) {
        list = list.filter(m => savedIds.has(m.id));
      }

      if (currentTag) {
        list = list.filter(m => {
          if (!m.tags || !Array.isArray(m.tags)) return false;
          return m.tags.some(t => t.toLowerCase().includes(currentTag));
        });
      }

      if (currentFilter === 'trending') {
        list.sort((a, b) => ((b.clicks || 0) * 2 + (b.createdAt || 0) / 100000000) - ((a.clicks || 0) * 2 + (a.createdAt || 0) / 100000000));
      } else if (currentFilter === 'new') {
        list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      } else if (currentFilter === 'og') {
        list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      } else if (currentFilter === 'clicks') {
        list.sort((a, b) => (b.clicks || 0) - (a.clicks || 0));
      }

      if (list.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        empty.classList.add('flex');
        return;
      }

      empty.classList.add('hidden');
      empty.classList.remove('flex');

      grid.innerHTML = list.map(m => {
        const isSaved = savedIds.has(m.id);
        const tags = (m.tags || []).map(t => 
          `<button onclick="event.stopPropagation(); filterByClickedTag('${escapeAttr(t)}')" class="text-[10px] px-2.5 py-0.5 rounded-full glass-pill text-white/70 hover:text-white transition-all">#${escapeHtml(t)}</button>`
        ).join('');

        let mediaHtml = '';
        if (m.type === 'video' || (m.url && m.url.match(/\.(mp4|webm|ogg)$/i))) {
          mediaHtml = `
            <div class="relative w-full aspect-square bg-black/40 flex items-center justify-center overflow-hidden">
              <video src="${m.url}" controls class="w-full h-full object-contain" preload="metadata"></video>
            </div>
          `;
        } else {
          mediaHtml = `
            <div class="relative w-full aspect-square bg-black/30 flex items-center justify-center overflow-hidden group">
              <img 
                src="${m.url}" 
                alt="${escapeAttr(m.title || 'Meme')}" 
                loading="lazy" 
                class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-105" 
                onerror="this.onerror=null; this.src='https://placehold.co/600x600/181b24/e2e8f0?text=No+Media';"
              />
              <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
            </div>
          `;
        }

        return `
          <article onclick="recordClickAndOpen('${m.id}', event)" class="glass-card rounded-3xl overflow-hidden flex flex-col cursor-pointer group">
            
            <div class="px-4 py-3 flex items-center justify-between border-b border-white/[0.06]">
              <h3 class="text-xs font-semibold text-white/90 truncate tracking-tight pr-2">${escapeHtml(m.title || 'Untitled Meme')}</h3>
              <button 
                onclick="toggleSave('${m.id}', event)" 
                title="${isSaved ? 'Remove bookmark' : 'Bookmark meme'}"
                class="glass-pill rounded-full p-1.5 ${isSaved ? 'text-rose-400 glass-pill-active' : 'text-white/60 hover:text-white'} transition-all">
                <i data-lucide="bookmark" class="w-3.5 h-3.5 ${isSaved ? 'fill-current' : ''}"></i>
              </button>
            </div>

            ${mediaHtml}

            <div class="p-3.5 flex flex-col gap-2.5 mt-auto border-t border-white/[0.06] bg-black/10">
              <div class="flex flex-wrap gap-1 max-h-12 overflow-hidden">
                ${tags}
              </div>
              <div class="flex items-center justify-between text-[11px] text-white/45 pt-0.5">
                <span class="flex items-center gap-1.5 font-medium text-white/60">
                  <i data-lucide="mouse-pointer-2" class="w-3 h-3 text-white/40"></i>
                  ${m.clicks || 0} clicks
                </span>
                <span>${m.createdAt ? new Date(m.createdAt).toLocaleDateString() : ''}</span>
              </div>
            </div>

          </article>
        `;
      }).join('');

      lucide.createIcons();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(str) {
      if (!str) return '';
      return String(str).replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
